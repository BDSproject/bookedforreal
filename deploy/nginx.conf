# ---------------------------------------------------------------------------
# Bookedforreal — Nginx reverse proxy (HTTP version).
# SSL is added automatically by: `sudo certbot --nginx -d bookedforreal.com -d '*.bookedforreal.com'`
# ---------------------------------------------------------------------------

# --- API subdomain --------------------------------------------------------
server {
    listen 80;
    server_name api.bookedforreal.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Web app + salon subdomains (*.bookedforreal.com) ---------------------
server {
    listen 80;
    server_name bookedforreal.com www.bookedforreal.com *.bookedforreal.com;

    # Proxy to the Next.js server (salon subdomains are resolved in-app via x-forwarded-host).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
