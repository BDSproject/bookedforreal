services:
  postgres:
    image: postgres:16-alpine
    container_name: bookedforreal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookedforreal
      POSTGRES_PASSWORD: bookedforreal
      POSTGRES_DB: bookedforreal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookedforreal -d bookedforreal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
